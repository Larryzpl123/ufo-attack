/* ---------- constants: 1:1 with main.py ---------- */
const WIDTH=800, HEIGHT=600;
const WHITE="rgb(255,255,255)", RED="rgb(255,0,0)", GREEN="rgb(0,255,0)", YELLOW="rgb(255,255,0)";
const FPS=60;
const PLAYER_SPEED=10, BULLET_SPEED=20, PLAYER_SHOOT_COOLDOWN=10;
const UFO_SPEED_MIN=2.5, UFO_SPEED_MAX=10, UFO_EDGE_OFFSET=20;
const UFO_VSPEED_MIN=0.5, UFO_VSPEED_MAX=2.0, UFO_VERTICAL_EDGE=30;
const UFO_BULLET_SPEED=5, UFO_ROCKET_SPEED=20;
const UFO_BLADE_SPEED_MIN=4, UFO_BLADE_SPEED_MAX=16;
const UFO_BLADE_ANGLE_MIN=225, UFO_BLADE_ANGLE_MAX=315;
const BLADE_SIZE=32;                              // sprite draw size
const BLADE_HITBOX=24;                            // collision box, 75% of sprite
const BLADE_INSET=(BLADE_SIZE-BLADE_HITBOX)/2;    // centred, because it spins
const BLADE_SPIN=0.6;                             // deg/frame per unit of speed
const MAX_DIFFICULTY=35, DIFFICULTY_INTERVAL=90, HIT_SCORE=100;
const DOUBLE_SHOT_DURATION=10*FPS;
const POWERUP_SPEED=2, POWERUP_DROP_CHANCE=10;
const UFO_MAX_Y=Math.floor(HEIGHT/2);

/* GameMaker's lengthdir_y is -len*sin(dir) (y axis down, angles CCW). An early
   Python port dropped the minus sign, so the blades flew upward and could never
   hit the player; main.py is fixed too. Set to false to see the old behaviour. */
const BLADE_MATCH_GML = true;

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndInt=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lengthdirX=(l,d)=>l*Math.cos(d*Math.PI/180);
const lengthdirY=(l,d)=>l*Math.sin(d*Math.PI/180)*(BLADE_MATCH_GML?-1:1);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const R=(x,y,w,h)=>({x,y,w,h});

/* ---------- high score: localStorage replaces highscore.txt ---------- */
const HS_KEY="ufoAttackHighScore";
function loadHighScore(){try{return parseInt(localStorage.getItem(HS_KEY))||0}catch(e){return 0}}
function saveHighScore(v){try{localStorage.setItem(HS_KEY,String(v))}catch(e){}}
let highScore=loadHighScore();

/* ---------- asset loading ---------- */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const overlay=document.getElementById("overlay");
const IMG={};
function img(key){const i=new Image();i.src=ASSETS[key]||"";IMG[key]=i;return i}
const playerImg=img("player"), ufoImg=img("ufo"), bulletImg=img("player_bullet"),
      ufoBulletImg=img("ufo_bullet"), rocketImg=img("ufo_rocket"), bladeImg=img("ufo_blade");
const ok=i=>i.complete&&i.naturalWidth>0;

let audioOn=false;
function mkSound(key){
  const src=ASSETS[key]; if(!src) return null;
  const pool=[]; for(let i=0;i<6;i++){const a=new Audio(src);a.volume=.35;pool.push(a)}
  let n=0;
  return ()=>{ if(!audioOn) return;
    const a=pool[n++%pool.length]; try{a.currentTime=0;a.play().catch(()=>{})}catch(e){} };
}
const shootSound=mkSound("player_bullet_wav"), hitSound=mkSound("hit_ufo_wav");

/* ---------- game state ---------- */
let playerX,playerY,playerRect,playerBullets,ufoBullets,ufoRockets,ufoBlades,powerups;
let ufoX,ufoY,ufoHspeed,ufoDirection,ufoVy;
let score,difficulty,frameCount,canShoot,shootTimer,gameOver,doubleShot,doubleShotTimer;
let a0,a1,a2,a3;

function resetGame(){
  playerX=Math.floor(WIDTH/2)-25; playerY=HEIGHT-100;
  playerRect=R(playerX,playerY,50,60);
  canShoot=true; shootTimer=0; playerBullets=[];

  ufoX=Math.floor(WIDTH/2)-35; ufoY=50; ufoHspeed=8; ufoDirection=1;
  ufoVy=rnd(UFO_VSPEED_MIN,UFO_VSPEED_MAX)*choice([-1,1]);

  ufoBullets=[]; ufoRockets=[]; ufoBlades=[];
  a0=60; a1=90; a2=120; a3=DIFFICULTY_INTERVAL;

  score=0; difficulty=0; frameCount=0;
  powerups=[]; doubleShot=false; doubleShotTimer=0;
  gameOver=false;
}

/* ---------- input ---------- */
const keys=Object.create(null);
const BLOCK=new Set(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"]);
addEventListener("keydown",e=>{
  if(BLOCK.has(e.code)) e.preventDefault();
  keys[e.code]=true;
  start();
  if(gameOver&&e.code==="KeyR") resetGame();
},{passive:false});
addEventListener("keyup",e=>{ keys[e.code]=false; });
addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; });

/* ---------- one fixed 60Hz step, ported line-for-line from main.py ---------- */
function step(){
  frameCount++;
  if(!gameOver){
    if(keys.ArrowLeft  && playerX>0)          playerX-=PLAYER_SPEED;
    if(keys.ArrowRight && playerX<WIDTH-50)   playerX+=PLAYER_SPEED;
    if(keys.ArrowUp    && playerY>0)          playerY-=PLAYER_SPEED;
    if(keys.ArrowDown  && playerY<HEIGHT-60)  playerY+=PLAYER_SPEED;
    playerRect.x=playerX; playerRect.y=playerY;

    if(doubleShot){ if(--doubleShotTimer<=0) doubleShot=false; }

    if(keys.Space && canShoot){
      if(doubleShot){
        playerBullets.push([playerX+25-4-10, playerY-10, 0, -BULLET_SPEED]);
        playerBullets.push([playerX+25-4+10, playerY-10, 0, -BULLET_SPEED]);
      } else {
        playerBullets.push([playerX+25-4, playerY-10, 0, -BULLET_SPEED]);
      }
      canShoot=false; shootTimer=PLAYER_SHOOT_COOLDOWN;
      if(shootSound) shootSound();
    }
    if(!canShoot && --shootTimer<=0) canShoot=true;

    ufoX+=ufoHspeed*ufoDirection;
    ufoY+=ufoVy;

    if(ufoX<=UFO_EDGE_OFFSET || ufoX+70>=WIDTH-UFO_EDGE_OFFSET){
      ufoDirection*=-1;
      ufoHspeed=rnd(UFO_SPEED_MIN,UFO_SPEED_MAX);
      ufoX=clamp(ufoX,UFO_EDGE_OFFSET,WIDTH-70-UFO_EDGE_OFFSET);
    }
    if(ufoY<=UFO_VERTICAL_EDGE || ufoY+50>=UFO_MAX_Y+UFO_VERTICAL_EDGE){
      ufoVy*=-1;
      ufoVy=rnd(UFO_VSPEED_MIN,UFO_VSPEED_MAX)*(ufoVy>0?1:-1);
      ufoY=clamp(ufoY,UFO_VERTICAL_EDGE,HEIGHT-50-UFO_VERTICAL_EDGE);
    }

    if(--a0<=0){
      ufoBullets.push([ufoX+35-5, ufoY+50, 0, UFO_BULLET_SPEED]);
      a0=Math.max(10, rndInt(40,80)-difficulty);
    }
    if(--a1<=0){
      const backward=-ufoDirection;
      ufoRockets.push([ufoX+35-6, ufoY+50, backward*(UFO_ROCKET_SPEED*0.5), UFO_ROCKET_SPEED]);
      a1=Math.max(10, rndInt(60,90)-difficulty);
    }
    if(--a2<=0){
      const angle=rnd(UFO_BLADE_ANGLE_MIN,UFO_BLADE_ANGLE_MAX);
      const speed=rnd(UFO_BLADE_SPEED_MIN,UFO_BLADE_SPEED_MAX);
      // [x, y, vx, vy, rotation, spin] - faster blades spin faster
      ufoBlades.push([ufoX+35-BLADE_SIZE/2, ufoY+50,
                      lengthdirX(speed,angle), lengthdirY(speed,angle),
                      0, speed*BLADE_SPIN]);
      a2=Math.max(10, rndInt(80,120)-difficulty);
    }
    if(--a3<=0){
      if(difficulty<MAX_DIFFICULTY) difficulty++;
      a3=DIFFICULTY_INTERVAL;
    }

    /* projectile motion + culling. The extra y<-64 test plugs a leak in the
       Python version, where upward blades were never removed. */
    const move=(arr)=>{
      for(let i=arr.length-1;i>=0;i--){
        const p=arr[i]; p[0]+=p[2]; p[1]+=p[3];
        if(p[1]>HEIGHT||p[1]<-64||p[0]<-64||p[0]>WIDTH+64) arr.splice(i,1);
      }
    };
    move(playerBullets); move(ufoBullets); move(ufoRockets); move(ufoBlades);
    for(const b of ufoBlades) b[4]=(b[4]+b[5])%360;

    for(let i=powerups.length-1;i>=0;i--){
      powerups[i][1]+=POWERUP_SPEED;
      if(powerups[i][1]>HEIGHT) powerups.splice(i,1);
    }

    const ufoRect=R(ufoX,ufoY,70,50);
    for(let i=0;i<playerBullets.length;i++){
      const b=playerBullets[i];
      if(hit(R(b[0],b[1],8,16), ufoRect)){
        playerBullets.splice(i,1);
        score+=HIT_SCORE;
        if(score>highScore){ highScore=score; saveHighScore(highScore); }
        if(rndInt(1,100)<=POWERUP_DROP_CHANCE) powerups.push([ufoX+35-15, ufoY+25]);
        if(hitSound) hitSound();
        break;
      }
    }

    for(const b of ufoBullets) if(hit(R(b[0],b[1],10,20),playerRect)){ gameOver=true; break; }
    if(!gameOver) for(const r of ufoRockets) if(hit(R(r[0],r[1],12,30),playerRect)){ gameOver=true; break; }
    if(!gameOver) for(const b of ufoBlades)
      if(hit(R(b[0]+BLADE_INSET,b[1]+BLADE_INSET,BLADE_HITBOX,BLADE_HITBOX),playerRect)){ gameOver=true; break; }
    if(!gameOver && hit(ufoRect,playerRect)) gameOver=true;

    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i];
      if(hit(R(p[0]-15,p[1]-15,30,30), playerRect)){
        powerups.splice(i,1);
        doubleShot=true; doubleShotTimer=DOUBLE_SHOT_DURATION;
      }
    }
  }
}

/* ---------- render ---------- */
const FONT='bold 30px Helvetica,Arial,sans-serif';
const BIG_FONT='bold 60px Helvetica,Arial,sans-serif';
function text(s,x,y,color=WHITE,f=FONT){ ctx.font=f; ctx.fillStyle=color; ctx.textBaseline="top"; ctx.fillText(s,x,y); }

function draw(){
  ctx.fillStyle="#000"; ctx.fillRect(0,0,WIDTH,HEIGHT);

  if(ok(playerImg)) ctx.drawImage(playerImg,playerX,playerY,50,60);
  else { ctx.fillStyle=GREEN; ctx.fillRect(playerX,playerY,50,60); }

  if(ok(ufoImg)) ctx.drawImage(ufoImg,ufoX,ufoY,70,50);
  else { ctx.fillStyle=RED; ctx.fillRect(ufoX,ufoY,70,50); }

  for(const b of playerBullets){
    if(ok(bulletImg)) ctx.drawImage(bulletImg,b[0],b[1],8,16);
    else { ctx.fillStyle=YELLOW; ctx.fillRect(b[0],b[1],8,16); }
  }
  for(const b of ufoBullets){
    if(ok(ufoBulletImg)) ctx.drawImage(ufoBulletImg,b[0],b[1],10,20);
    else { ctx.fillStyle="rgb(255,100,100)"; ctx.fillRect(b[0],b[1],10,20); }
  }
  for(const r of ufoRockets){
    if(ok(rocketImg)) ctx.drawImage(rocketImg,r[0],r[1],12,30);
    else { ctx.fillStyle="rgb(255,150,0)"; ctx.fillRect(r[0],r[1],12,30); }
  }
  for(const b of ufoBlades){
    const cx=b[0]+BLADE_SIZE/2, cy=b[1]+BLADE_SIZE/2, r=BLADE_SIZE/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(-b[4]*Math.PI/180);
    if(ok(bladeImg)) ctx.drawImage(bladeImg,-r,-r,BLADE_SIZE,BLADE_SIZE);
    else {
      ctx.fillStyle="rgb(200,200,255)"; ctx.beginPath();
      for(let k=0;k<3;k++){
        const a=(k*120-90)*Math.PI/180;
        k?ctx.lineTo(r*Math.cos(a),r*Math.sin(a)):ctx.moveTo(r*Math.cos(a),r*Math.sin(a));
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  for(const p of powerups){
    ctx.fillStyle=GREEN;  ctx.beginPath(); ctx.arc(p[0]|0,p[1]|0,15,0,7); ctx.fill();
    ctx.fillStyle=YELLOW; ctx.beginPath(); ctx.arc(p[0]|0,p[1]|0,10,0,7); ctx.fill();
  }

  text("Score: "+score,10,10);
  text("High Score: "+highScore,10,50);
  text("Difficulty: "+difficulty,10,90);
  if(doubleShot) text("DOUBLE SHOT",Math.floor(WIDTH/2)-60,130,GREEN);

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,0.706)"; ctx.fillRect(0,0,WIDTH,HEIGHT);
    text("GAME OVER",Math.floor(WIDTH/2)-150,Math.floor(HEIGHT/2)-50,RED,BIG_FONT);
    text("Final Score: "+score,Math.floor(WIDTH/2)-80,Math.floor(HEIGHT/2)+20);
    text("Press 'R' to restart",Math.floor(WIDTH/2)-100,Math.floor(HEIGHT/2)+80);
  }
}

/* ---------- fixed-timestep loop: 60 logic ticks/s on any refresh rate ---------- */
const STEP=1000/FPS;
let started=false, acc=0, last=0;
function frame(t){
  if(!last) last=t;
  acc+=Math.min(t-last,250); last=t;      // 250ms cap: no spiral after a tab switch
  let guard=0;
  while(acc>=STEP && guard++<8){ step(); acc-=STEP; }
  draw();
  requestAnimationFrame(frame);
}

function start(){
  if(started) return;
  started=true; audioOn=true;
  overlay.style.display="none";
  requestAnimationFrame(frame);
}
overlay.addEventListener("click",start);
addEventListener("pointerdown",start);

/* ---------- scale to window, keep 800x600 aspect ---------- */
const stage=document.getElementById("stage");
function fit(){
  const s=Math.min(innerWidth/WIDTH, innerHeight/HEIGHT, 1.6);
  stage.style.transform="scale("+s+")";
}
addEventListener("resize",fit); fit();

resetGame();
draw();
</script>
